  input[type=password] {

  input[type=password]:focus { border-color: #1E4A44; }
  .lembrar {

  button {
    width: 100%; padding: 14px; font-size: 17px; font-weight: 600; border: 0;
    border-radius: 9px; background: #1E4A44; color: #F5F1E8; cursor: pointer; font-family: inherit;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .erro { color: #A44A32; font-size: 14px; margin-top: 12px; min-height: 18px; }
  .rodape { margin-top: 18px; font-size: 13px; color: #56626F; }
  input[type=password] { border-color: #B9AD95; }

const CHAVE_LS = "repasse-imoveis-senha";
const VERSAO = "20261102183147";

/*
 * Guarda contra pagina velha presa no celular. O aparelho dela guardava a versao antiga e
 * nao mostrava a nova. Aqui a pagina pergunta ao servidor qual e a versao atual; se for
 * outra, ela se recarrega uma unica vez com um endereco novo, que o cache nao conhece.
 */
(function () {
  try {
    fetch('repasse-versao.txt?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (t) {
        if (!t) return;
        t = t.trim();
        if (!t || t === VERSAO) return;
        var tentada = null;
        try { tentada = sessionStorage.getItem('repasse-recarga'); } catch (e) {}
        if (tentada === t) return;              // ja tentou por esta versao: nao insiste
        try { sessionStorage.setItem('repasse-recarga', t); } catch (e) {}
        location.replace('repasse.html?v=' + encodeURIComponent(t));
      })
      .catch(function () {});
  } catch (e) {}
})();

function b64bytes(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function decifrar(senha) {
  const raw = b64bytes(PAYLOAD);
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: 300000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, chave, ct);
  return new TextDecoder().decode(pt);
}

async function abrir(senha, lembrar) {
  const btn = document.getElementById("btn"), erro = document.getElementById("erro");
  btn.disabled = true; btn.textContent = "Abrindo…"; erro.textContent = "";
  try {
    const html = await decifrar(senha);
    if (lembrar) { try { localStorage.setItem(CHAVE_LS, senha); } catch (e) {} }
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { localStorage.removeItem(CHAVE_LS); } catch (x) {}
    btn.disabled = false; btn.textContent = "Abrir";
    erro.textContent = "Senha incorreta. Tente de novo.";
  }
}

document.getElementById("f").addEventListener("submit", function (ev) {
  ev.preventDefault();
  const s = document.getElementById("senha").value;
  if (s) abrir(s, document.getElementById("lembrar").checked);
});

(function () {
  let s = null;
  try { s = localStorage.getItem(CHAVE_LS); } catch (e) {}
  if (s) abrir(s, false);
})();
</script>
