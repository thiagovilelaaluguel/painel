const CHAVE_LS = "painel-imoveis-senha";

function b64bytes(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function decifrar(senha) {
  const raw = b64bytes(PAYLOAD);
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: 300000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, chave, ct);
}

/* 13/10/2026: a página vem comprimida (gzip, bytes 1f 8b no começo); sem compressão, abre como antes. */
async function paraTexto(buf) {
  const b = new Uint8Array(buf);
  if (b[0] !== 0x1f || b[1] !== 0x8b) return new TextDecoder().decode(b);
  if (typeof DecompressionStream === "undefined") throw new Error("SEM_DESCOMPRESSAO");
  const fluxo = new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(fluxo).text();
}

async function abrir(senha, lembrar) {
  const btn = document.getElementById("btn"), erro = document.getElementById("erro");
  btn.disabled = true; btn.textContent = "Abrindo…"; erro.textContent = "";
  let buf;
  try {
    buf = await decifrar(senha);
  } catch (e) {
    try { localStorage.removeItem(CHAVE_LS); } catch (x) {}
    btn.disabled = false; btn.textContent = "Abrir painel";
    erro.textContent = "Senha incorreta. Tente novamente.";
    return;
  }
  try {
    const html = await paraTexto(buf);
    if (lembrar) { try { localStorage.setItem(CHAVE_LS, senha); } catch (e) {} }
    document.open(); document.write(html); document.close();
  } catch (e) {
    /* a senha estava certa (decifrou); o problema é o navegador. A senha guardada fica. */
    btn.disabled = false; btn.textContent = "Abrir painel";
    erro.textContent = e && e.message === "SEM_DESCOMPRESSAO"
      ? "Este navegador está desatualizado e não abre o painel. Atualize o navegador (ou o sistema do celular) e tente de novo."
      : "Não foi possível abrir o painel neste navegador. Tente atualizar a página.";
  }
}

document.getElementById("f").addEventListener("submit", function (ev) {
  ev.preventDefault();
  const s = document.getElementById("senha").value;
  if (s) abrir(s, document.getElementById("lembrar").checked);
});

// senha guardada no aparelho? entra direto, sem digitar
(function () {
  let s = null;
  try { s = localStorage.getItem(CHAVE_LS); } catch (e) {}
  if (s) abrir(s, false);
})();
</script>
